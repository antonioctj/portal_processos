server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 30m;

    root __APP_DIR__/frontend/dist;
    index index.html;

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # API — inclui o endpoint de progresso em tempo real (SSE) da análise de documentos,
    # por isso desabilitamos buffering e usamos timeout de leitura mais longo.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA — todas as rotas do React Router caem no index.html
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
}
